{% extends "base.html" %}
{% block content %}
  <h1>todomini</h1>

  <!-- Progressive enhancement (STK-HTMX-03): a real form that works without JS;
       hx-* enhances. hx-indicator + disabled submit = STK-HTMX-05. -->
  <form
    method="post"
    action="/todos"
    hx-post="/todos"
    hx-target="#todo-region"
    hx-swap="innerHTML"
    hx-disabled-elt="find button"
    hx-indicator="#add-spinner"
  >
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <label for="title">New todo</label>
    <input id="title" name="title" required maxlength="200" />
    <button type="submit">Add</button>
    <span id="add-spinner" class="htmx-indicator" role="status">Adding…</span>
  </form>

  <div id="todo-region">
    {% include "partials/todo_list.html" %}
  </div>
{% endblock %}
