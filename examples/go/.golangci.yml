# House golangci-lint config (STK-GO-02), v2 schema.
# `standard` default set = errcheck, govet, ineffassign, staticcheck, unused.
version: "2"

linters:
  default: standard
  enable:
    - gosec # SEC-SAST for Go; justify any #nosec inline with a trailing reason

formatters:
  enable:
    - gofmt
    - goimports
