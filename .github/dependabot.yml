# Dependency-update automation (DEV-DEPS-02). Grouped weekly PRs, one per ecosystem, so
# updates arrive in one review sitting (DEV-DEPS-03); majors are read, never auto-merged.
# Security alerts and updates for examples/ lockfiles come from Dependabot alerts as before.
version: 2
updates:
  - package-ecosystem: github-actions # SHA-pinned actions in .github/workflows (SEC-SUPPLY)
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: pip # the toolchain pinned in pyproject.toml [dependency-groups] dev
    directory: /
    schedule:
      interval: weekly
    groups:
      python-tooling:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)
