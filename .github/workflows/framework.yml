# Self-CI for the governance framework: the framework passes its own gates.
name: framework
on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml ruff
      - name: Framework self-lint (schema, rules, index freshness)
        run: python3 checks/lint-framework.py
      - name: Ruff over check scripts
        run: ruff check checks/
      - name: Shell syntax
        run: bash -n checks/*.sh hooks/*.sh templates/scaffolds/_common/install-git-hooks.sh templates/scaffolds/_common/githooks/*
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
