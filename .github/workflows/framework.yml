# Self-CI for the governance framework: the framework passes its own gates. ASPEC is a
# published package (GOVERNANCE.md), so this is DEV-CI's T3 job set. Every job runs the
# toolchain pinned in pyproject.toml from a .venv (STK-PY-08); lint and test call the same
# scripts as the git hooks, so CI and hooks agree on what passing means.
# Actions are pinned to commit SHAs (SEC-SUPPLY); Dependabot proposes updates.
name: framework
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN; jobs widen only what they need.
permissions:
  contents: read

env:
  SETUP_VENV: >-
    python -m venv .venv &&
    .venv/bin/pip install -q pip==26.2.1 &&
    .venv/bin/pip install -q --group dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: ${{ env.SETUP_VENV }}
      - name: Self-lint, ruff (lint + format), shell syntax
        run: scripts/lint.sh

  # No standalone typechecker for STK-PY; the job keeps DEV-CI-01's name (no-op variant).
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Typecheck (no-op)
        run: echo "no separate typechecker — STK-PY names no standalone typechecker"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: ${{ env.SETUP_VENV }}
      - name: Unit tests with coverage
        run: scripts/test.sh

  coverage-ratchet:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: ${{ env.SETUP_VENV }}
      - name: Rebuild coverage
        run: scripts/test.sh
      - name: Ratchet check (TST-RATCHET; CI only checks, never writes)
        run: .venv/bin/python checks/coverage-ratchet.py --check

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: ${{ env.SETUP_VENV }}
      - name: Static analysis (bandit over checks/, STK-PY-04)
        run: bash checks/sec-sast.sh --tier T3

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: ${{ env.SETUP_VENV }}
      - name: Dependency vulnerability audit (pip-audit, SEC-SUPPLY-01)
        run: bash checks/sec-sca.sh --tier T3

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks-action comments on PR lines with leaks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
