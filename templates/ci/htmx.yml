# CI: htmx — composition of templates/ci/_fragments/* for STK-HTMX projects
# (FastAPI + Jinja2 + htmx on STK-PY). /bootstrap-repo copies this to
# .github/workflows/ci.yml and prunes jobs the project's tier doesn't require (per
# DEV-CI): T1/T2 keep gitleaks (+ coverage-ratchet at T2); T3 adds
# lint/test/sast/sca/a11y/lighthouse; license-audit is T4. No typecheck job: STK-PY
# configures no standalone typechecker (fragment README: such stacks omit it).
# Placeholders resolved: CMD_LINT=scripts/lint.sh · CMD_TEST_COV=scripts/test.sh —
# the same commands the local hooks run. At T3+ SEC-SUPPLY pins actions to SHAs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # fragment: gitleaks.yml — SEC-SECRETS-01 (all tiers with CI)
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # fragment: lint.yml — DEV-CI (T3+; T1/T2 rely on the pre-commit hook)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Lint
        run: scripts/lint.sh

  # fragment: test.yml — DEV-CI / TST-POLICY (STK-HTMX-02/-07)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Test with coverage
        run: scripts/test.sh
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.json
            coverage/coverage-summary.json
            coverage.out
            lcov.info
          if-no-files-found: ignore

  # fragment: coverage-ratchet.yml — TST-RATCHET (T2+)
  coverage-ratchet:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Rebuild coverage
        run: scripts/test.sh
      - name: Ratchet check
        run: python3 .governance/coverage-ratchet.py --check

  # fragment: sast.yml — SEC-SAST (T2+): bandit per STK-PY-04
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Static application security testing
        run: .venv/bin/bandit -r src -q

  # fragment: sca.yml — SEC-SUPPLY (T2+): pip-audit per STK-PY-05
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Dependency vulnerability audit
        run: .venv/bin/pip-audit

  # fragment: a11y.yml — UX-A11Y (T3+ web). Server-rendered: no build step; uvicorn
  # serves the app directly.
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Build and serve
        run: |
          .venv/bin/uvicorn app.main:app --port 8000 &
          npx wait-on http://localhost:8000
      - name: axe-core scan
        run: npx @axe-core/cli http://localhost:8000 --exit

  # fragment: lighthouse.yml — OPS-PERF (T3+ web). Budgets live in lighthouserc.json
  # (seeded by the scaffold; startServerCommand = uvicorn).
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Build
        run: echo "server-rendered app — no build step"
      - name: Lighthouse CI
        run: npx @lhci/cli autorun

  # fragment: license-audit.yml — LEG-LICENSING (T4 only; pruned below T4)
  license-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Dependency license audit
        run: >
          .venv/bin/pip install --quiet pip-licenses && .venv/bin/pip-licenses
          --allow-only "MIT License;BSD License;Apache Software License;ISC License;
          Python Software Foundation License;Mozilla Public License 2.0 (MPL 2.0)"
