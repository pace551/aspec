# Fragment: typecheck — DEV-CI. Stacks without a separate typechecker (Go, Rust, and
# Python until STK-PY names one) use the no-op variant at the bottom of this file:
# DEV-CI-01 keeps the job name on every stack so branch protection can require it.
typecheck:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    # {{SETUP_STEPS}}
    - name: Typecheck
      run: {{CMD_TYPECHECK}}

# No-op variant — the compiler (or nothing, for Python) carries the check elsewhere.
