# CI — rust stack (STK-RUST). Concrete composition of templates/ci/_fragments/*.
# /bootstrap-repo copies this to .github/workflows/ci.yml and prunes jobs the
# project's tier doesn't require (DEV-CI): T1/T2 typically keep gitleaks + sca and
# rely on git hooks for lint/test; T3+ runs everything; license-audit is T4.
#
# Scripts contract (_common/README.md): lint/test jobs run scripts/lint.sh and
# scripts/test.sh — the exact commands the pre-commit/pre-push hooks run.
#
# fragment: typecheck.yml — no-op variant: rustc typechecks in build/test, but
# DEV-CI-01 keeps the job name (see fragment comment).
# fragment: sast.yml — clippy, the Rust SAST tool (SEC-SAST per-stack table). It
# repeats lint's clippy pass so T1/T2, which prune lint, still run SAST in CI.
#
# {{SETUP_STEPS}} resolved for rust:
#   - uses: dtolnay/rust-toolchain@stable        (components: rustfmt, clippy)
#   - uses: Swatinem/rust-cache@v2
# Action pins are major-version tags; at T3+ SEC-SUPPLY upgrades them to commit SHAs.

name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN (SEC-AUTHZ-04); jobs widen only what they need.
permissions:
  contents: read

jobs:
  # fragment: lint.yml — {{CMD_LINT}} = scripts/lint.sh
  # (= cargo fmt --check && cargo clippy --all-targets -- -D warnings)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: scripts/lint.sh

  # fragment: typecheck.yml (no-op variant) — DEV-CI-01 keeps the job name so branch
  # protection lists the same required checks on every stack; rustc typechecks in the test job.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Typecheck (no-op)
        run: echo "no separate typechecker — rustc typechecks in the test job"

  # fragment: test.yml — {{CMD_TEST_COV}} = scripts/test.sh
  # (cargo-llvm-cov runs the suite and emits lcov.info for the ratchet)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Test with coverage
        run: scripts/test.sh
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info
          if-no-files-found: ignore

  # fragment: coverage-ratchet.yml — TST-RATCHET (T2+); CI only checks, never writes.
  coverage-ratchet:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Rebuild coverage
        run: scripts/test.sh
      - name: Ratchet check
        run: python3 .governance/coverage-ratchet.py --check

  # fragment: gitleaks.yml — SEC-SECRETS-01 (layer G); full history scan.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks-action comments on PR lines with leaks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # fragment: sast.yml — {{CMD_SAST}} = clippy, the Rust SAST tool per the SEC-SAST table.
  # Same command as lint's clippy pass, kept as its own job because T1/T2 prune lint
  # (hooks carry it) but keep sast.
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Static application security testing
        run: cargo clippy --all-targets -- -D warnings

  # fragment: sca.yml — {{CMD_SCA}} = cargo audit against Cargo.lock (STK-RUST-05, T2+)
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Dependency vulnerability audit
        run: cargo audit

  # fragment: license-audit.yml — {{CMD_LICENSES}} = cargo-deny against deny.toml's
  # allowlist (LEG-LICENSING-01, T4)
  license-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Dependency license audit
        run: cargo deny check licenses
