# CI — python stack (STK-PY). Concrete composition of templates/ci/_fragments/*.
# /bootstrap-repo copies this to .github/workflows/ci.yml and prunes jobs the
# project's tier doesn't require (DEV-CI): T1/T2 typically keep gitleaks + sast + sca
# and rely on git hooks for lint/test; T3+ runs everything; license-audit is T4.
#
# Scripts contract (_common/README.md): lint/test jobs run scripts/lint.sh and
# scripts/test.sh — the exact commands the pre-commit/pre-push hooks run, so hooks
# and CI never disagree about what "passing" means.
#
# {{SETUP_STEPS}} resolved for python:
#   - uses: actions/setup-python@v5           (python-version: "3.14")
#   - python -m venv .venv && .venv/bin/pip install -e '.[dev]'
# Action pins are major-version tags; at T3+ SEC-SUPPLY upgrades them to commit SHAs.

name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN (SEC-AUTHZ-04); jobs widen only what they need.
permissions:
  contents: read

jobs:
  # fragment: lint.yml — {{CMD_LINT}} = scripts/lint.sh
  # (= .venv/bin/ruff format --check . && .venv/bin/ruff check .)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Lint
        run: scripts/lint.sh

  # fragment: typecheck.yml (no-op variant) — DEV-CI-01 keeps the job name so branch
  # protection lists the same required checks on every stack; STK-PY names no standalone typechecker.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Typecheck (no-op)
        run: echo "no separate typechecker — STK-PY names no standalone typechecker"

  # fragment: test.yml — {{CMD_TEST_COV}} = scripts/test.sh (emits coverage.json)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Test with coverage
        run: scripts/test.sh
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.json
          if-no-files-found: ignore

  # fragment: coverage-ratchet.yml — TST-RATCHET (T2+); CI only checks, never writes.
  coverage-ratchet:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Rebuild coverage
        run: scripts/test.sh
      - name: Ratchet check
        run: python3 .governance/coverage-ratchet.py --check

  # fragment: gitleaks.yml — SEC-SECRETS-01 (layer G); full history scan.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks-action comments on PR lines with leaks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # fragment: sast.yml — {{CMD_SAST}} = bandit over src/ (STK-PY-04)
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Static application security testing
        run: .venv/bin/bandit -r src -q

  # fragment: sca.yml — {{CMD_SCA}} = pip-audit against the venv (STK-PY-05, T2+)
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Dependency vulnerability audit
        run: .venv/bin/pip-audit

  # fragment: license-audit.yml — {{CMD_LICENSES}} = pip-licenses (LEG-LICENSING-01, T4)
  license-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Dependency license audit
        # Fails closed. Every license a package declares must be allowed: pip-licenses'
        # own --allow-only passes a package if any one classifier is allowed ("BSD" +
        # "LGPL" would pass), so it only collects the data and the check runs below.
        # SPDX expressions match only verbatim, so an AND with an unlisted license
        # ("MIT AND CC-BY-NC-4.0") fails; the list holds the SPDX ids, their classifier
        # names, and common OR pairings of allowed licenses. An unlisted OR fails until
        # reviewed and added. --ignore-packages skips this project's own (possibly
        # unlicensed) package; its dependencies are still audited.
        run: |
          .venv/bin/pip install --quiet pip-licenses
          project=$(.venv/bin/python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])")
          allow="MIT;BSD-2-Clause;BSD-3-Clause;Apache-2.0;ISC;PSF-2.0;MPL-2.0"
          allow+=";MIT License;BSD License;Apache Software License;ISC License (ISCL)"
          allow+=";Python Software Foundation License;Mozilla Public License 2.0 (MPL 2.0)"
          allow+=";Apache-2.0 OR BSD-2-Clause;Apache-2.0 OR BSD-3-Clause;Apache-2.0 OR MIT;MIT OR Apache-2.0"
          .venv/bin/pip-licenses --ignore-packages "$project" --format=json --output-file=licenses.json
          .venv/bin/python - "$allow" <<'PY'
          import json, sys
          allow = {name.lower() for name in sys.argv[1].split(";")}
          bad = [p for p in json.load(open("licenses.json"))
                 if not all(lic.strip().lower() in allow for lic in p["License"].split("; "))]
          for p in bad:
              print(f"license not allowed: {p['Name']} {p['Version']}: {p['License']}", file=sys.stderr)
          sys.exit(1 if bad else 0)
          PY
