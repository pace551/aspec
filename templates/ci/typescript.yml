# CI — typescript stack (STK-TS). Concrete composition of templates/ci/_fragments/*.
# /bootstrap-repo copies this to .github/workflows/ci.yml and prunes jobs the
# project's tier doesn't require (DEV-CI): T1/T2 typically keep gitleaks + sast + sca
# and rely on git hooks for lint/test; T3+ runs everything; license-audit is T4.
#
# Scripts contract (_common/README.md): lint/test jobs run scripts/lint.sh and
# scripts/test.sh — the exact commands the pre-commit/pre-push hooks run.
#
# {{SETUP_STEPS}} resolved for typescript:
#   - uses: actions/setup-node@v4                (node-version-file: .nvmrc, cache: npm)
#   - npm ci                                     (never npm install in CI — STK-TS-05)
# Action pins are major-version tags; at T3+ SEC-SUPPLY upgrades them to commit SHAs.

name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # fragment: lint.yml — {{CMD_LINT}} = scripts/lint.sh
  # (= node_modules/.bin/prettier --check . && node_modules/.bin/eslint .)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: scripts/lint.sh

  # fragment: typecheck.yml — {{CMD_TYPECHECK}} = tsc --noEmit (STK-TS-02)
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: node_modules/.bin/tsc --noEmit

  # fragment: test.yml — {{CMD_TEST_COV}} = scripts/test.sh
  # (emits coverage/coverage-summary.json for the ratchet)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Test with coverage
        run: scripts/test.sh
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/coverage-summary.json
          if-no-files-found: ignore

  # fragment: coverage-ratchet.yml — TST-RATCHET (T2+); CI only checks, never writes.
  coverage-ratchet:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Rebuild coverage
        run: scripts/test.sh
      - name: Ratchet check
        run: python3 .governance/coverage-ratchet.py --check

  # fragment: gitleaks.yml — SEC-SECRETS-01 (layer G); full history scan.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # fragment: sast.yml — {{CMD_SAST}} = semgrep (typescript ruleset)
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Static application security testing
        run: semgrep scan --config p/typescript --error

  # fragment: sca.yml — {{CMD_SCA}} = npm audit, high+ severity (STK-TS-05, T2+)
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
