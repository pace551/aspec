# {{PROJECT_NAME}} — single configuration home (STK-PY-01): metadata, deps, tool config.
[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = "{{ONE_LINE_DESCRIPTION}}"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.4",
  "bandit>=1.7",
  "pip-audit>=2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# House ruff config, verbatim per STK-PY-03 — extend per-project, never weaken silently.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".governance"]  # vendored governance scripts are not project code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
