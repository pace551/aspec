# Local-dev PostgreSQL (STK-PG). Prod is managed (RDS/Neon/Supabase) — STK-PG-01.
# Password below is local-only by design; real credentials come from .env (SEC-SECRETS).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
